
name: Final Project Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  api-test:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        run: chmod +x gradlew

      - name: Run tests with Gradle
        run: ./gradlew test --no-configuration-cache

      - name: Archive test result
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: API Test Report
          path: build/reports/tests/test/

  web-test:
    name: Run Web Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: api-test

    steps:
      - uses: actions/checkout@v2

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 'stable'

      - name: Use Gradle 7.4
        run: |
          wget https://services.gradle.org/distributions/gradle-7.4-bin.zip
          unzip gradle-7.4-bin.zip
          export PATH=$PWD/gradle-7.4/bin:$PATH
          gradle -v

      - name: Set up Gradle
        run: chmod +x gradlew

      - name: Run tests with Gradle
        run: ./gradlew test

      - name: Archive test result
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: Web Test Report
          path: build/reports/tests/test/

      - name: GitHub Pages action
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/reports/tests/test



